name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate canonical example
        run: noxsum-lab validate examples/canonical_level_v1.json

      - name: Import final Grant36 campaign
        run: |
          noxsum-lab import-grant fixtures/grant36_v0_5.json /tmp/grant36-canonical.json \
            --ref feature/grant36-v0.5-board-shapes \
            --source-path data/grant36_v0_5.json
          noxsum-lab validate /tmp/grant36-canonical.json

      - name: Revalidate final Grant36 campaign
        run: noxsum-lab revalidate-grant fixtures/grant36_v0_5.json

      - name: Generate deterministic sample
        run: |
          noxsum-lab generate /tmp/noxsum-generated.json --seed 20260925 --count 12 --normal 3
          noxsum-lab validate /tmp/noxsum-generated.json

      - name: Mine v0.2 smoke sample
        run: |
          noxsum-lab mine --seed 20260925 --count 64 \
            --output /tmp/mining.json \
            --csv /tmp/mining.csv \
            --report /tmp/mining.md \
            --top 10
          noxsum-lab validate /tmp/mining.json
